<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--vscode-font-family, 'Segoe UI', system-ui, sans-serif);
      font-size: var(--vscode-font-size, 13px);
      color: var(--vscode-foreground, #ccc);
      padding: 12px;
      line-height: 1.5;
    }
    .section { margin-bottom: 16px; border-radius: 8px; overflow: hidden; }
    .section-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; font-weight: 600; font-size: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .thinking .section-header {
      background: rgba(139, 92, 246, 0.15); color: #a78bfa;
      border-left: 3px solid #8b5cf6;
    }
    .content .section-header {
      background: rgba(34, 197, 94, 0.15); color: #4ade80;
      border-left: 3px solid #22c55e;
    }
    .section-body { padding: 12px; font-size: 13px; white-space: pre-wrap; }
    .thinking .section-body { background: rgba(139, 92, 246, 0.05); font-style: italic; }
    .content .section-body { background: rgba(34, 197, 94, 0.05); }
  </style>
</head>
<body>
  <div class="section thinking">
    <div class="section-header">🧠 Thinking Trace <span class="model-badge">flash</span></div>
    <div class="section-body" id="thinking">Waiting...</div>
  </div>
  <div class="section content">
    <div class="section-header">✨ Response</div>
    <div class="section-body" id="content"></div>
  </div>
  <script>
    const vscode = acquireVsCodeApi();
    window.addEventListener('message', e => {
      const { type, text } = e.data;
      if (type === 'thinking') {
        document.getElementById('thinking').textContent += text;
      } else if (type === 'content') {
        document.getElementById('content').textContent += text;
      } else if (type === 'clear') {
        document.getElementById('thinking').textContent = '';
        document.getElementById('content').textContent = '';
      }
    });
  </script>
</body>
</html>
